<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission CGL 2026 & O-Level Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #1e293b;
      --sidebar-bg: #0f172a;
      --text-main: #cbd5e1;
      --text-bright: #f8fafc;
      --text-muted: #64748b;
      --primary-bright: #34d399;
      --secondary-bright: #38bdf8;
      --border-light: rgba(255, 255, 255, 0.05);
      --checked-gradient: linear-gradient(135deg, #059669, #0284c7);
      --day-bg: #151f32;
    }
    
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; display: flex; height: 100vh; background: var(--bg-main); color: var(--text-main); width: 100%; overflow: hidden; }
    
    .sidebar { width: 280px; background: var(--sidebar-bg); padding: 20px; box-shadow: 4px 0 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--border-light); overflow-y: auto; }
    .sidebar h2 { margin-top: 0; margin-bottom: 20px; font-size: 18px; font-weight: 900; text-align: center; color: var(--secondary-bright); border-bottom: 2px solid var(--bg-main); padding-bottom: 15px; width: 100%; }
    .sidebar-section-title { align-self: flex-start; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 15px 0 6px 5px; font-weight: 800; }
    
    .task { width: 100%; background: #151f32; padding: 12px 16px; margin: 4px 0; border-radius: 10px; text-align: left; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #94a3b8; border: 1px solid transparent; transition: all 0.2s; }
    .task:hover { background: #1e293b; color: var(--text-bright); }
    .task.active { background: rgba(52, 211, 153, 0.1); color: var(--primary-bright); border-color: rgba(52, 211, 153, 0.2); font-weight: 700; }
    
    .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; }
    .topbar { background: var(--sidebar-bg); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); gap: 15px; }
    .welcome-section { display: flex; flex-direction: column; gap: 4px; }
    .digital-clock { font-size: 12px; font-weight: 800; color: var(--secondary-bright); background: rgba(56, 189, 248, 0.08); padding: 4px 10px; border-radius: 6px; align-self: flex-start; }
    .welcome-greet { margin: 0; font-size: 20px; font-weight: 800; color: var(--text-bright); }
    
    .sync-box { display: flex; flex-direction: column; gap: 6px; background: #151f32; padding: 8px; border-radius: 12px; border: 1px solid var(--border-light); }
    .sync-actions { display: flex; gap: 6px; }
    .sync-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-light); cursor: pointer; font-weight: 700; font-size: 11px; }
    .sync-btn.export { background: rgba(52, 211, 153, 0.15); color: var(--primary-bright); }
    .sync-btn.import { background: rgba(56, 189, 248, 0.15); color: var(--secondary-bright); }
    .sync-input { padding: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg-main); color: white; font-size: 11px; width: 140px; text-align: center; }

    .calendar-controls { display: flex; align-items: center; gap: 10px; }
    .calendar-controls h2 { margin: 0; font-size: 15px; min-width: 110px; text-align: center; color: var(--text-bright); }
    .calendar-controls button { background: #151f32; border: 1px solid var(--border-light); color: var(--text-main); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    
    .cards-zone { flex: 1; padding: 20px 30px; overflow-y: auto; }
    .cards-grid { display: flex; flex-direction: column; gap: 25px; width: 100%; }
    
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border-light); width: 100%; }
    .card h3 { margin-top: 0; margin-bottom: 15px; font-size: 15px; color: var(--text-bright); }
    
    .calendar-grid-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; }
    .chart-box { width: 100%; height: 200px; position: relative; }

    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 8px; width: 100%; }
    .weekday-header { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; text-align: center; }
    .day { background: var(--day-bg); border: 1px solid var(--border-light); padding: 8px 4px; border-radius: 12px; text-align: center; font-size: 12px; color: var(--text-main); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 75px; height: auto; }
    .day.checked { background: var(--checked-gradient); border-color: transparent; color: var(--text-bright); font-weight: 700; }
    .day.today { border: 2px solid var(--secondary-bright); color: var(--secondary-bright); font-weight: 800; }
    
    .checkbox-container { display: inline-block; position: relative; width: 16px; height: 16px; margin-top: 4px; }
    .calendar input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 2px solid #475569; border-radius: 5px; cursor: pointer; background: rgba(0,0,0,0.2); margin: 0; }
    .day.checked input[type="checkbox"] { border-color: #fff; background: #fff; }

    .counter-container { display: flex; align-items: center; justify-content: space-between; gap: 2px; margin-top: auto; background: rgba(0,0,0,0.3); padding: 2px; border-radius: 6px; width: 100%; max-width: 52px; }
    .counter-btn { background: #475569; color: white; border: none; font-size: 9px; font-weight: 900; width: 15px; height: 14px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .counter-value { font-size: 10px; font-weight: 800; text-align: center; width: 16px; color: var(--text-bright); }

    .progress-container { margin-top: 10px; border-top: 1px solid var(--border-light); padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .mini-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; border: 1px solid var(--border-light); color: var(--text-bright); }
    .stats-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); }

    /* 📋 COMPACT DAILY SCRATCHPAD DESIGN */
    .scratch-container { max-width: 550px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .scratch-item { display: flex; align-items: center; background: #151f32; padding: 4px 15px; border-radius: 20px; border: 1px solid var(--border-light); justify-content: space-between; }
    .scratch-input { flex: 1; background: transparent; border: none; color: var(--text-bright); font-size: 14px; font-weight: 600; padding: 8px 4px; outline: none; }
    .scratch-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-bright); margin-left: 10px; }
    .scratch-item.done { opacity: 0.5; }
    .scratch-item.done .scratch-input { text-decoration: line-through; color: var(--text-muted); }

    @media (max-width: 768px) {
      body { flex-direction: column; overflow-y: auto; height: auto; }
      .sidebar { width: 100%; padding: 15px; }
      .topbar { padding: 15px; flex-direction: column; text-align: center; }
      .sync-box { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>DASHBOARD 2026</h2>
    <div class="sidebar-section-title">Daily Tracking</div>
    <div class="task active" id="tab-self" onclick="switchView('self')">Self Discipline</div>
    <div class="task" id="tab-study" onclick="switchView('study')">Study Architecture</div>
    <div class="task" id="tab-scratchpad" onclick="switchView('scratchpad')">📋 Daily Scratchpad</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="welcome-section">
        <div class="digital-clock" id="liveClock">00:00:00 AM</div>
        <h1 class="welcome-greet">Hello, Utkarsh!</h1>
      </div>
      
      <div class="sync-box">
        <div class="sync-actions">
          <button class="sync-btn export" onclick="exportDataString()">📤 Backup</button>
          <button class="sync-btn import" onclick="importDataString()">📥 Fetch</button>
        </div>
        <input type="text" id="syncTokenField" class="sync-input" placeholder="Data Code String" onclick="this.select()">
      </div>

      <div class="calendar-controls" id="calControls">
        <button onclick="prevMonth()">◀</button>
        <h2 id="monthTitle">June 2026</h2>
        <button onclick="nextMonth()">▶</button>
      </div>
    </div>

    <div class="cards-zone">
      <div class="cards-grid" id="view-self">
        <div class="card">
          <h3>Habits Completion Overview</h3>
          <div class="chart-box"><canvas id="habitChart"></canvas></div>
        </div>
        <div class="calendar-grid-row">
          <div class="card">
            <h3>Meditation</h3>
            <div class="calendar" id="meditationCalendar"></div>
            <div class="progress-container">
              <div class="mini-circle" id="meditationProgress">0%</div>
              <div class="stats-lbl" id="meditationStats">0 / 0</div>
            </div>
          </div>
          <div class="card">
            <h3>Workout</h3>
            <div class="calendar" id="workoutCalendar"></div>
            <div class="progress-container">
              <div class="mini-circle" id="workoutProgress">0%</div>
              <div class="stats-lbl" id="workoutStats">0 / 0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="cards-grid" id="view-study" style="display:none;">
        <div class="card">
          <h3>Study Hours Curve</h3>
          <div class="chart-box"><canvas id="studyCurveChart"></canvas></div>
        </div>
        <div class="card">
          <h3>Study Calendar</h3>
          <div class="calendar" id="studyCalendar"></div>
          <div class="progress-container">
            <div class="mini-circle" id="studyProgress">0%</div>
            <div class="stats-lbl" id="studyStats">0h / 0h</div>
          </div>
        </div>
      </div>

      <!-- DAILY SCRATCHPAD CARD (8 MINIMUM INPUT FIELDS WITH RIGHT CHECKBOXES) -->
      <div class="cards-grid" id="view-scratchpad" style="display:none;">
        <div class="card">
          <h3 style="margin-bottom: 20px; text-align: center;">🎯 Today's Task Targets</h3>
          <div class="scratch-container">
            <div class="scratch-item" id="item-task1">
              <input type="text" id="input-task1" class="scratch-input" placeholder="Write daily task #1..." oninput="saveScratchText('task1')">
              <input type="checkbox" id="chk-task1" class="scratch-checkbox" onchange="toggleScratchRow('task1')">
            </div>
            <div class="scratch-item" id="item-task2">
              <input type="text" id="input-task2" class="scratch-input" placeholder="Write daily task #2..." oninput="saveScratchText('task2')">
              <input type="checkbox" id="chk-task2" class="scratch-checkbox" onchange="toggleScratchRow('task2')">
            </div>
            <div class="scratch-item" id="item-task3">
              <input type="text" id="input-task3" class="scratch-input" placeholder="Write daily task #3..." oninput="saveScratchText('task3')">
              <input type="checkbox" id="chk-task3" class="scratch-checkbox" onchange="toggleScratchRow('task3')">
            </div>
            <div class="scratch-item" id="item-task4">
              <input type="text" id="input-task4" class="scratch-input" placeholder="Write daily task #4..." oninput="saveScratchText('task4')">
              <input type="checkbox" id="chk-task4" class="scratch-checkbox" onchange="toggleScratchRow('task4')">
            </div>
            <div class="scratch-item" id="item-task5">
              <input type="text" id="input-task5" class="scratch-input" placeholder="Write daily task #5..." oninput="saveScratchText('task5')">
              <input type="checkbox" id="chk-task5" class="scratch-checkbox" onchange="toggleScratchRow('task5')">
            </div>
            <div class="scratch-item" id="item-task6">
              <input type="text" id="input-task6" class="scratch-input" placeholder="Write daily task #6..." oninput="saveScratchText('task6')">
              <input type="checkbox" id="chk-task6" class="scratch-checkbox" onchange="toggleScratchRow('task6')">
            </div>
            <div class="scratch-item" id="item-task7">
              <input type="text" id="input-task7" class="scratch-input" placeholder="Write daily task #7..." oninput="saveScratchText('task7')">
              <input type="checkbox" id="chk-task7" class="scratch-checkbox" onchange="toggleScratchRow('task7')">
            </div>
            <div class="scratch-item" id="item-task8">
              <input type="text" id="input-task8" class="scratch-input" placeholder="Write daily task #8..." oninput="saveScratchText('task8')">
              <input type="checkbox" id="chk-task8" class="scratch-checkbox" onchange="toggleScratchRow('task8')">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMonth = new Date().getMonth() + 1; 
    let currentYear = new Date().getFullYear(); 
    let currentActiveTab = 'self';
    let habitChartInstance = null; let studyChartInstance = null;

    function getItemValue(key) { return localStorage.getItem(key) || null; }
    function saveItemValue(key, value) { localStorage.setItem(key, value.toString()); }

    function exportDataString() {
      let dump = {};
      for(let i=0; i<localStorage.length; i++) { let k = localStorage.key(i); if(!k.startsWith('Chart')) dump[k] = localStorage.getItem(k); }
      let encoded = btoa(encodeURIComponent(JSON.stringify(dump)));
      document.getElementById('syncTokenField').value = encoded; navigator.clipboard.writeText(encoded);
      alert("✅ Original Data Code Copied! Paste on your other device and press Fetch.");
    }

    function importDataString() {
      let val = document.getElementById('syncTokenField').value.trim(); if(!val) return;
      try {
        let decoded = JSON.parse(decodeURIComponent(atob(val))); for(let k in decoded) { localStorage.setItem(k, decoded[k]); }
        alert("🎉 Original Data Synced!"); reloadCalendars(); loadScratchpadData(); switchView('self');
      } catch(e) { alert("Invalid Code String!"); }
    }

    function saveScratchText(key) { saveItemValue(`scr_txt_${key}`, document.getElementById(`input-${key}`).value); }
    function toggleScratchRow(key) {
      let isChecked = document.getElementById(`chk-${key}`).checked; saveItemValue(`scr_sts_${key}`, isChecked);
      document.getElementById(`item-${key}`).classList.toggle('done', isChecked);
    }
    function loadScratchpadData() {
      for(let i=1; i<=8; i++) {
        let k = `task${i}`;
        if(document.getElementById(`input-${k}`)) document.getElementById(`input-${k}`).value = getItemValue(`scr_txt_${k}`) || '';
        let chk = document.getElementById(`chk-${k}`);
        if(chk) { let s = getItemValue(`scr_sts_${k}`) === 'true'; chk.checked = s; document.getElementById(`item-${k}`).classList.toggle('done', s); }
      }
    }

    function startDigitalClock() { setInterval(() => { const now = new Date(); let h = now.getHours(); const m = String(now.getMinutes()).padStart(2, '0'); const s = String(now.getSeconds()).padStart(2, '0'); const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; document.getElementById('liveClock').innerText = `${String(h).padStart(2,'0')}:${m}:${s} ${ampm}`; }, 1000); }

    function switchView(viewKey) {
      currentActiveTab = viewKey;
      document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${viewKey}`).classList.add('active');
      document.getElementById('view-self').style.display = (viewKey === 'self') ? 'flex' : 'none';
      document.getElementById('view-study').style.display = (viewKey === 'study') ? 'flex' : 'none';
      document.getElementById('view-scratchpad').style.display = (viewKey === 'scratchpad') ? 'flex' : 'none';
      document.getElementById('calControls').style.display = (viewKey !== 'scratchpad') ? 'flex' : 'none';
      if(viewKey !== 'scratchpad') triggerChartUpdate();
    }

    function generateCalendar(cardId, progressId, statsId, keyPrefix, isStudy = false) {
      const calendar = document.getElementById(cardId); if (!calendar) return; calendar.innerHTML = '';
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(wd => { const hl = document.createElement('div'); hl.className = 'weekday-header'; hl.innerText = wd; calendar.appendChild(hl); });
      const offset = new Date(currentYear, currentMonth - 1, 1).getDay();
      for (let p = 0; p < offset; p++) calendar.appendChild(document.createElement('div'));
      
      for (let day = 1; day <= daysInMonth; day++) {
        const db = document.createElement('div'); db.className = 'day'; db.innerHTML = `${day}`;
        const label = document.createElement('label'); label.className = 'checkbox-container';
        const cb = document.createElement('input'); cb.type = 'checkbox';
        const sk = `${keyPrefix}_${currentYear}_${currentMonth}_${day}`;
        cb.checked = getItemValue(sk) === 'true';
        if (cb.checked) db.classList.add('checked');
        if (new Date().getDate() === day && (new Date().getMonth()+1) === currentMonth) db.classList.add('today');
        
        cb.onchange = () => { saveItemValue(sk, cb.checked); db.classList.toggle('checked', cb.checked); updateProgress(cardId, progressId, statsId, keyPrefix, isStudy); triggerChartUpdate(); };
        
        if (isStudy) {
          const hk = sk + '_hours'; let curH = parseInt(getItemValue(hk) || '0', 10);
          const cd = document.createElement('div'); cd.className = 'counter-container';
          cd.innerHTML = `<button class="counter-btn" onclick="hCh('${hk}',-1,this,'${sk}','${cardId}','${progressId}','${statsId}','${keyPrefix}')">-</button><span class="counter-value">${curH}</span><button class="counter-btn" onclick="hCh('${hk}',1,this,'${sk}','${cardId}','${progressId}','${statsId}','${keyPrefix}')">+</button>`;
          db.appendChild(cd);
        }
        label.appendChild(cb); db.appendChild(label); calendar.appendChild(db);
      }
      updateProgress(cardId, progressId, statsId, keyPrefix, isStudy);
    }
    
    function hCh(hk, d, btn, sk, cid, pid, stid, kp) {
      event.stopPropagation(); let v = parseInt(getItemValue(hk) || '0', 10) + d;
      if (v >= 0 && v <= 12) {
        saveItemValue(hk, v); btn.parentElement.querySelector('.counter-value').innerText = v;
        const cb = btn.closest('.day').querySelector('input[type="checkbox"]');
        if(v > 0 && !cb.checked) { cb.checked = true; cb.onchange(); }
        else if(v === 0 && cb.checked) { cb.checked = false; cb.onchange(); }
        updateProgress(cid, pid, stid, kp, true);
      }
    }

    function updateProgress(cardId, progressId, statsId, keyPrefix, isStudy) {
      const pEl = document.getElementById(progressId); if(!pEl) return;
      let percent = 0; const cbs = document.querySelectorAll(`#${cardId} input[type="checkbox"]`);
      const checked = Array.from(cbs).filter(c => c.checked).length;
      if (isStudy) {
        let th = 0; for(let d=1; d<=cbs.length; d++) th += parseInt(getItemValue(`${keyPrefix}_${currentYear}_${currentMonth}_${d}_hours`) || '0', 10);
        percent = cbs.length ? Math.round((th / (cbs.length * 8)) * 100) : 0;
        pEl.style.background = `radial-gradient(closest-side, #1e293b 76%, transparent 80%), conic-gradient(#06d6a0 ${percent}%, #151f32 0%)`;
        document.getElementById(statsId).innerText = `${th}h / ${cbs.length * 8}h`;
      } else {
        percent = cbs.length ? Math.round((checked / cbs.length) * 100) : 0;
        pEl.style.background = `radial-gradient(closest-side, #1e293b 76%, transparent 80%), conic-gradient(#ffb703 ${percent}%, #151f32 0%)`;
        document.getElementById(statsId).innerText = `${checked} / ${cbs.length}`;
      }
      pEl.innerText = percent + '%';
    }

    function triggerChartUpdate() {
      const ctxH = document.getElementById('habitChart'); if(!ctxH) return;
      let mc=0, wc=0, dm = new Date(currentYear, currentMonth, 0).getDate();
      for(let d=1; d<=dm; d++) { if(getItemValue(`meditation_${currentYear}_${currentMonth}_${d}`)==='true') mc++; if(getItemValue(`workout_${currentYear}_${currentMonth}_${d}`)==='true') wc++; }
      if(habitChartInstance) habitChartInstance.destroy();
      habitChartInstance = new Chart(ctxH, { type:'bar', data:{ labels:['Meditation','Workout'], datasets:[{data:[mc,wc], backgroundColor:['#ffb703','#38bdf8'], borderRadius:6}] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} } });

      const ctxS = document.getElementById('studyCurveChart'); if(!ctxS) return;
      let labels = []; let data = []; for (let d = 1; d <= dm; d++) { labels.push(`${d}`); data.push(parseInt(getItemValue(`study_${currentYear}_${currentMonth}_${d}_hours`) || '0', 10)); }
      if(studyChartInstance) studyChartInstance.destroy();
      studyChartInstance = new Chart(ctxS, { type:'line', data:{ labels:labels, datasets:[{data:data, borderColor:'#06d6a0', backgroundColor:'rgba(6,214,160,0.02)', borderWidth:2, tension:0.15, fill:true, pointRadius:1}] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} } });
    }

    function prevMonth() { currentMonth--; if(currentMonth<1){currentMonth=12; currentYear--;} reloadCalendars(); }
    function nextMonth() { currentMonth++; if(currentMonth>12){currentMonth=1; currentYear++;} reloadCalendars(); }
    function reloadCalendars() {
      document.getElementById('monthTitle').innerText = new Date(currentYear, currentMonth-1).toLocaleString('default',{month:'long', year:'numeric'});
      generateCalendar('meditationCalendar','meditationProgress','meditationStats','meditation');
      generateCalendar('workoutCalendar','workoutProgress','workoutStats','workout');
      generateCalendar('studyCalendar','studyProgress','studyStats','study',true);
      triggerChartUpdate();
    }

    startDigitalClock(); reloadCalendars(); loadScratchpadData(); switchView('self');
  </script>
</body>
</html>
